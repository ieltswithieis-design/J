name = "humraz-stories-api"
main = "worker.js"
compatibility_date = "2026-09-07"

[vars]
# Change these before deployment. GITHUB_TOKEN is a secret and must NEVER be placed here.
GITHUB_OWNER = "YOUR_GITHUB_USERNAME"
GITHUB_REPO = "YOUR_REPOSITORY_NAME"
GITHUB_BRANCH = "main"
GITHUB_FILE_PATH = "data/stories.json"
ALLOWED_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"
